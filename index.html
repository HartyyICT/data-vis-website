<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESG Project</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="home-screen">
    <h1>Vergelijk twee landen</h1>

    <div class="selectors">
      <div class="selector">
        <label for="country1">Land 1</label>
        <select id="country1">
          <option value="">Kies...</option>
          <option value="nederland">Nederland</option>
          <option value="zweden">Zweden</option>
          <option value="india">India</option>
          <option value="australie">Australië</option>
          <option value="verenigde-staten">Verenigde Staten</option>
          <option value="brazilie">Brazilië</option>
        </select>
      </div>

      <div class="selector">
        <label for="country2">Land 2</label>
        <select id="country2">
          <option value="">Kies...</option>
          <option value="nederland">Nederland</option>
          <option value="zweden">Zweden</option>
          <option value="india">India</option>
          <option value="australie">Australië</option>
          <option value="verenigde-staten">Verenigde Staten</option>
          <option value="brazilie">Brazilië</option>
        </select>
      </div>
    </div>

    <button id="compare-btn">Vergelijk</button>
  </div>

  <div class="compare-view" id="compare-view" style="display:none;">
    <button class="back-btn" id="back-btn">← Terug</button>
    <div class="compare-track" id="compare-track"></div>
  </div>

  <script src="/js/boom-generator.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
